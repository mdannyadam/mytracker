name: Sainsburys job watcher
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: watcher
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python watcher.py
      - name: Save state
        run: |
          git config user.name "watcher"
          git config user.email "watcher@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen" && git push)
